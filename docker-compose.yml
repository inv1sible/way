x-app: &app
  build: ./web
  image: way-web
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    SEARXNG_URL: http://searxng:8080
    TOOLS_URL: http://tools:8000
  volumes:
    - /etc/localtime:/etc/localtime:ro
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
    searxng:
      condition: service_started

services:
  web:
    <<: *app
    command: ["/app/entrypoint.sh"]
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8000"

  worker:
    <<: *app
    networks: [default, probe]
    command: ["celery", "-A", "config", "worker", "--loglevel", "info", "--concurrency", "2"]
    # Laufende Analysen (KI-Bericht dauert Minuten) beim Neustart zu Ende laufen lassen
    stop_grace_period: 5m

  # Lokale Werkzeuge (whois, dig, openssl, curl). Eigenes Netz ohne Datenbank und Redis; zusätzlich
  # lehnt der Dienst selbst jedes nicht-öffentliche Ziel ab.
  tools:
    build: ./tools
    image: way-tools
    environment:
      TOOLS_TOKEN: ${TOOLS_TOKEN:?TOOLS_TOKEN fehlt in .env}
    networks: [probe]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osint}
      POSTGRES_USER: ${POSTGRES_USER:-osint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped

networks:
  probe:

volumes:
  pgdata:
