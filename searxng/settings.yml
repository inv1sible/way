use_default_settings: true

general:
  instance_name: "way-search"

server:
  # wird durch die Umgebungsvariable SEARXNG_SECRET überschrieben
  secret_key: "change-me"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json

# Für Rufnummern-Recherche möglichst viele unabhängige Websuchen aktivieren;
# einzelne Engines werden von den Anbietern zeitweise gesperrt.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: presearch
    disabled: false
