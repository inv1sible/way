{% extends "base.html" %}
{% load ui_tags %}
{% block title %}{% ui 'Passwort zurücksetzen' 'Reset password' %} · Who Are You{% endblock %}
{% block content %}
<form method="post" class="card login">{% csrf_token %}
  <h1>{% ui 'Passwort zurücksetzen' 'Reset password' %}</h1>
  <label>E-Mail {{ form.email }}</label>{{ form.email.errors }}
  <button>{% ui 'Link anfordern' 'Request link' %}</button>
</form>
{% endblock %}
