{% load ui_tags i18n %}{% get_current_language as LANGUAGE_CODE %}{% if not lookup.is_running %}
  {% if enrichment_allowed %}
  <button type="button" class="icon" popovertarget="enrich-pop" title="{% ui 'Mehr Erkenntnisse gewinnen' 'Gain more intelligence' %}" aria-label="{% ui 'Mehr Erkenntnisse gewinnen' 'Gain more intelligence' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/></svg></button>
  {% endif %}
  {% if owned_target_setup_available %}
  <button type="button" class="icon{% if enrichment_setup_required %} setup{% endif %}" popovertarget="owned-pop" title="{% if enrichment_setup_required %}{% if enrichment_requires_asn %}{% ui 'Erlaubte Origin-ASNs für dieses eigene System hinterlegen' 'Add allowed origin ASNs for this owned system' %}{% else %}{% ui 'Dieses Ziel als eigenes System einrichten' 'Set up this target as an owned system' %}{% endif %}{% else %}{% ui 'Eigenes System prüfen oder aktualisieren' 'Review or update owned system' %}{% endif %}" aria-label="{% ui 'Eigenes System einrichten' 'Set up owned system' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v5c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6l8-3Z"/><path d="M12 8v6M9 11h6"/></svg></button>
  {% endif %}
  <a class="icon" href="{% url 'lookups:pdf' lookup.pk %}?language={{ LANGUAGE_CODE }}" title="{% ui 'Als PDF herunterladen' 'Download as PDF' %}" aria-label="{% ui 'Als PDF herunterladen' 'Download as PDF' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg></a>
  <form method="post" action="{% url 'lookups:rerun' lookup.pk %}">{% csrf_token %}
    <button class="icon" title="{% ui 'Erneut analysieren' 'Run analysis again' %}" aria-label="{% ui 'Erneut analysieren' 'Run analysis again' %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  </form>
{% endif %}
