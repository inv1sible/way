{% load ui_tags %}{% if hits %}
  <h2>{% ui 'Fundstellen im Web' 'Web findings' %} ({{ hits|length }})</h2>
  <ul class="hits">
  {% for hit in hits %}
    <li>
      <a href="{{ hit.url }}" target="_blank" rel="noopener noreferrer nofollow">{{ hit.titel|default:hit.url }}</a>
      <span class="muted hit-url">{{ hit.url|truncatechars:90 }}</span>
      {% if hit.auszug %}<p>{{ hit.auszug }}</p>{% endif %}
    </li>
  {% endfor %}
  </ul>
{% endif %}
