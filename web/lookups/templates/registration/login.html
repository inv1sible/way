{% extends "base.html" %}
{% block title %}Anmelden · OSINT-Agent{% endblock %}
{% block content %}
<form method="post" class="card login">{% csrf_token %}
  <h1>Anmelden</h1>
  {% if form.errors %}<p class="error">Benutzername oder Passwort falsch.</p>{% endif %}
  <label>Benutzername <input name="username" autocomplete="username" autofocus required></label>
  <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
  <input type="hidden" name="next" value="{{ next }}">
  <button>Anmelden</button>
</form>
{% endblock %}
